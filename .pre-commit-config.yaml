# Two hooks, and both are about this repository being public.
#
#   pre-commit install    once, per clone
#
# The second is the legal guard. `legal/` holds published agreements, and the
# two mistakes available there are both silent: committing a draft into a
# public tree, and editing a version that has been frozen. `legal/README.md`
# says why each matters; the guard is `legal/tool/check_legal.mjs` and it
# imports nothing but `node:` built-ins, so the hook needs no install and runs
# in milliseconds. It is scoped to `legal/`, so nothing else pays for it.
#
# TruffleHog over what is staged, failing on any finding, unverified ones
# included; CI's `.github/workflows/secrets.yml` runs the same scan over
# everything pushed, so a commit made with `--no-verify` is still caught. The
# binary is per machine, like `pre-commit`: the release download from
# https://github.com/trufflesecurity/trufflehog/releases, checked against its
# checksums.txt, or `brew install trufflehog`. Without it the hook fails and
# says so rather than letting the commit through unscanned.
#
# There are no exclusions, and the history scans clean. A token-shaped string
# that is a deliberate fake gets an `--exclude-paths` file naming it, on
# review — never a pattern that widens.

repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: secret scan
        entry: bash tool/trufflehog/scan.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: legal-check
        name: the legal manifest and the documents agree
        entry: bash -c 'cd legal && node tool/check_legal.mjs'
        language: system
        files: ^legal/
        pass_filenames: false
