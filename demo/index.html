<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>The City of Elsenmar — a Ripple Effect demo</title>
    <meta
      name="description"
      content="A branching tabletop adventure written in Ripple Effect, played in your browser by its engine: pictures, music, dice and two languages, as the author exported them."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <!-- The landing page's BrandLockup, transcribed: the mark from
           src/components/ripple-mark.tsx (the app's three-ring table, in a
           32x32 box, unit 16) and the wordmark, the display name with the
           second word in the accent. -->
      <a class="brand" href="https://ripplefx.app">
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="7.36" stroke="currentColor" stroke-opacity="0.95" stroke-width="2.08" />
          <circle cx="16" cy="16" r="11.52" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.76" />
          <circle cx="16" cy="16" r="15.36" stroke="currentColor" stroke-opacity="0.28" stroke-width="1.44" />
          <circle cx="16" cy="16" r="2.72" fill="currentColor" />
        </svg>
        <span>Ripple <span class="accent">Effect</span></span>
      </a>
      <div class="controls">
        <select id="locale" aria-label="Language" hidden></select>
        <button id="mute" type="button" aria-pressed="false" hidden>Sound on</button>
        <button id="restart" type="button" hidden>Restart</button>
      </div>
    </header>
    <main id="stage" aria-live="polite">
      <p class="note">Loading the engine…</p>
    </main>
    <footer>
      <span id="credit">Written in Ripple Effect and played by its engine, in this page.</span>
      <span>
        <a id="get-editor" href="https://ripplefx.app/download">Write your own — get the editor</a> ·
        <a href="https://www.npmjs.com/package/@ripplefx/player">@ripplefx/player</a> ·
        <a href="https://legal.ripplefx.app/privacy">Privacy</a>
      </span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
